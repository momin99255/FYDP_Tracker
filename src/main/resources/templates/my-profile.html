<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile - FYDP Sync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar(page='profile')}"></div>

<div class="container mt-4 mt-md-5 mb-5 px-3">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <div class="d-flex justify-content-end mb-3">
                <a href="javascript:history.back()" class="btn btn-black-dash nav-btn fw-bold px-4 py-2">&larr; Back</a>
            </div>

            <div th:if="${successMessage}" class="alert alert-success shadow-sm" th:text="${successMessage}"></div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-3 p-md-4">

                    <div class="text-center mb-4">
                        <img th:if="${profile.profilePicture}" th:src="@{${profile.profilePicture}}" alt="Profile"
                             style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #eef2ff;">
                        <div th:unless="${profile.profilePicture}"
                             class="mx-auto d-flex align-items-center justify-content-center"
                             style="width:100px;height:100px;border-radius:50%;background:#eef2ff;font-size:2.2rem;">
                            👤
                        </div>
                        <h5 class="fw-bold mt-3 mb-0 text-break" th:text="${currentUser.name}">Name</h5>
                        <span class="text-muted" th:text="'@' + ${currentUser.username}">@username</span>
                        <div th:unless="${isOwnProfile}" class="mt-1">
                            <span class="badge bg-light text-muted border">Viewing this member's profile</span>
                        </div>
                    </div>

                    <div th:unless="${editMode}">
                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-start py-2 border-bottom">
                                <span class="fw-bold text-muted small">Contact No.</span>
                                <span class="text-end text-break" th:text="${profile.contactNo} ?: '— not set —'">—</span>
                            </div>
                            <div class="d-flex justify-content-between align-items-start py-2 border-bottom">
                                <span class="fw-bold text-muted small">University</span>
                                <span class="text-end text-break" th:text="${profile.university} ?: '— not set —'">—</span>
                            </div>
                            <div class="d-flex justify-content-between align-items-start py-2 border-bottom">
                                <span class="fw-bold text-muted small">Department</span>
                                <span class="text-end text-break" th:text="${profile.department} ?: '— not set —'">—</span>
                            </div>
                            <div th:if="${currentUser.role.name() == 'STUDENT'}" class="d-flex justify-content-between align-items-start py-2 border-bottom">
                                <span class="fw-bold text-muted small">Batch</span>
                                <span class="text-end text-break" th:text="${profile.batch} ?: '— not set —'">—</span>
                            </div>
                            <div th:if="${currentUser.role.name() == 'SUPERVISOR'}" class="d-flex justify-content-between align-items-start py-2 border-bottom">
                                <span class="fw-bold text-muted small">Designation</span>
                                <span class="text-end text-break" th:text="${profile.designation != null ? profile.designation.label : '— not set —'}">—</span>
                            </div>
                        </div>

                        <a th:if="${isOwnProfile}" th:href="@{/profile/edit}" class="btn btn-primary fw-bold w-100">✏️ Edit Profile</a>
                    </div>

                    <form th:if="${editMode and isOwnProfile}" th:action="@{/profile/update}" method="post" enctype="multipart/form-data">

                        <div class="mb-3">
                            <label class="form-label fw-bold">Profile Picture</label>
                            <input type="file" name="profilePictureFile" accept="image/*" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Contact No.</label>
                            <input type="text" name="contactNo" class="form-control"
                                   th:value="${profile.contactNo}" placeholder="e.g. 01XXXXXXXXX">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">University</label>
                            <input type="text" name="university" class="form-control"
                                   th:value="${profile.university}" placeholder="e.g. IUT">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Department</label>
                            <input type="text" name="department" class="form-control"
                                   th:value="${profile.department}" placeholder="e.g. CSE">
                        </div>

                        <div class="mb-4" th:if="${currentUser.role.name() == 'STUDENT'}">
                            <label class="form-label fw-bold">Batch</label>
                            <input type="text" name="batch" class="form-control"
                                   th:value="${profile.batch}" placeholder="e.g. 51">
                        </div>

                        <div class="mb-4" th:if="${currentUser.role.name() == 'SUPERVISOR'}">
                            <label class="form-label fw-bold">Designation</label>
                            <select name="designation" class="form-select">
                                <option value="">Select designation...</option>
                                <option th:each="d : ${T(com.momin.fydp_sync.enums.Designation).values()}"
                                        th:value="${d}"
                                        th:text="${d.label}"
                                        th:selected="${profile.designation == d}"></option>
                            </select>
                        </div>

                        <div class="d-flex flex-column flex-sm-row gap-2">
                            <button type="submit" class="btn btn-success fw-bold flex-grow-1">Save Changes</button>
                            <a th:href="@{/profile}" class="btn btn-outline-secondary fw-bold">Cancel</a>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
