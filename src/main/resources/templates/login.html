<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - FYDP Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body { background-color: #f4f7fb; }
        .wrapper {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
        }
        .premium-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            border: none;
            overflow: hidden;
            position: relative;
        }
        /* Top Accent Bar */
        .premium-card::before {
            content: "";
            height: 6px;
            width: 100%;
            background: linear-gradient(90deg, #4f46e5, #818cf8);
            position: absolute;
            top: 0;
            left: 0;
        }
        .custom-input {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .custom-input:focus {
            background-color: #ffffff;
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
            outline: none;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-weight: bold;
            color: white;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);
            color: white;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar(page='login')}"></div>

<div class="wrapper py-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 col-xl-4">

                <!-- Alerts -->
                <div th:if="${param.error}" class="alert alert-danger shadow-sm fw-bold rounded-3 text-center mb-3 border-0" style="background-color: #fee2e2; color: #b91c1c;">⚠️ Invalid credentials!</div>
                <div th:if="${param.registered}" class="alert alert-success shadow-sm fw-bold rounded-3 text-center mb-3 border-0">✅ Account created! Please login.</div>
                <div th:if="${param.logout}" class="alert alert-secondary shadow-sm fw-bold rounded-3 text-center mb-3 border-0">👋 Safely logged out.</div>

                <div class="card premium-card p-4 p-md-5">
                    <div class="text-center mb-4 pt-2">
                        <div class="d-inline-block p-3 rounded-circle mb-3" style="background: #eef2ff;">
                            <h2 class="m-0" style="line-height: 1;">👋</h2>
                        </div>
                        <h3 class="fw-bold" style="color: #1e293b;">Welcome Back</h3>
                        <p class="text-muted small">Sign in to continue to FYDP Sync</p>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-uppercase" style="color: #64748b; letter-spacing: 0.5px;">Username or Email</label>
                            <input type="text" name="username" class="form-control custom-input" placeholder="e.g. momin123" required autofocus>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold small text-uppercase" style="color: #64748b; letter-spacing: 0.5px;">Password</label>
                            <input type="password" name="password" class="form-control custom-input" placeholder="Enter password" required>
                        </div>

                        <button type="submit" class="btn btn-gradient w-100 mt-2">Sign In</button>
                    </form>

                    <div class="text-center mt-4 pt-4 border-top">
                        <p class="text-muted small mb-0 fw-medium">New to FYDP Sync? <a th:href="@{/register}" class="text-decoration-none fw-bold" style="color: #4f46e5;">Create an Account</a></p>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
