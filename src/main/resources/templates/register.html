<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - FYDP Sync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body { background-color: #f4f7fb; }
        .wrapper {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
        }
        .premium-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            border: none;
            overflow: hidden;
            position: relative;
        }
        .premium-card::before {
            content: "";
            height: 6px;
            width: 100%;
            background: linear-gradient(90deg, #4f46e5, #818cf8);
            position: absolute;
            top: 0;
            left: 0;
        }
        .custom-input {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .custom-input:focus {
            background-color: #ffffff;
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
            outline: none;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-weight: bold;
            color: white;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);
            color: white;
        }

        /* Modern Role Selection */
        .role-group { display: flex; gap: 12px; }
        .role-option { flex: 1; }
        .role-option input[type="radio"] { display: none; }
        .role-option label {
            display: block; text-align: center; padding: 12px;
            border: 2px solid #e2e8f0; border-radius: 10px; cursor: pointer;
            font-weight: 600; color: #64748b; background: #ffffff;
            transition: all 0.2s; margin: 0;
        }
        .role-option input[type="radio"]:checked + label {
            border-color: #4f46e5; background: #eef2ff; color: #4f46e5;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar(page='register')}"></div>

<div class="wrapper py-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card premium-card p-4 p-md-5">
                    <div class="text-center mb-4 pt-2">
                        <div class="d-inline-block p-3 rounded-circle mb-3" style="background: #eef2ff;">
                            <h2 class="m-0" style="line-height: 1;">🚀</h2>
                        </div>
                        <h3 class="fw-bold" style="color: #1e293b;">Create Account</h3>
                        <p class="text-muted small">Join FYDP Sync and manage your projects effortlessly</p>
                    </div>

                    <form th:action="@{/register}" th:object="${user}" method="post">

                        <div class="mb-3">
                            <label class="form-label fw-bold small text-uppercase" style="color: #64748b; letter-spacing: 0.5px;">Full Name</label>
                            <input type="text" th:field="*{name}" class="form-control custom-input" placeholder="e.g. Mominul Islam">
                            <div class="text-danger small mt-1 fw-bold" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold small text-uppercase" style="color: #64748b; letter-spacing: 0.5px;">Username</label>
                                <input type="text" th:field="*{username}" class="form-control custom-input" placeholder="e.g. momin123">
                                <div class="text-danger small mt-1 fw-bold" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold small text-uppercase" style="color: #64748b; letter-spacing: 0.5px;">Email Address</label>
                                <input type="email" th:field="*{email}" class="form-control custom-input" placeholder="momin@seu.edu.bd">
                                <div class="text-danger small mt-1 fw-bold" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold small text-uppercase" style="color: #64748b; letter-spacing: 0.5px;">Password</label>
                            <input type="password" th:field="*{password}" class="form-control custom-input" placeholder="Create a strong password">
                            <div class="text-danger small mt-1 fw-bold" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold small text-uppercase d-block mb-2" style="color: #64748b; letter-spacing: 0.5px;">Select Your Role</label>
                            <div class="role-group">
                                <div class="role-option">
                                    <input type="radio" th:field="*{role}" value="STUDENT" id="roleStudent">
                                    <label for="roleStudent">👨‍🎓 Student</label>
                                </div>
                                <div class="role-option">
                                    <input type="radio" th:field="*{role}" value="SUPERVISOR" id="roleSupervisor">
                                    <label for="roleSupervisor">👨‍🏫 Supervisor</label>
                                </div>
                            </div>
                            <div class="text-danger small mt-2 fw-bold" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
                        </div>

                        <button type="submit" class="btn btn-gradient w-100 mt-2">Create Account</button>
                    </form>

                    <div class="text-center mt-4 pt-4 border-top">
                        <p class="text-muted small mb-0 fw-medium">Already have an account? <a th:href="@{/login}" class="text-decoration-none fw-bold" style="color: #4f46e5;">Log In</a></p>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
