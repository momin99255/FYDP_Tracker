<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${workspace.title} + ' - FYDP Sync'">Workspace - FYDP Sync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar(page='project')}"></div>

<div class="container my-5 pt-2">
    <a th:href="@{/projects/{id}(id=${workspace.project.id})}" class="text-decoration-none fw-bold text-muted small">&larr; Back to project</a>

    <div class="card auth-card p-4 shadow-sm mt-3">
        <div class="d-flex justify-content-between align-items-start mb-3">
            <h3 class="fw-bold text-dark mb-0" th:text="${workspace.title}">Workspace Title</h3>
            <span class="badge bg-secondary px-3 py-2" th:text="${workspace.category}">CATEGORY</span>
        </div>
        <p class="text-muted small mb-4" th:text="'Added on: ' + ${#temporals.format(workspace.createdAt, 'dd MMM yyyy')}">Date</p>

        <!-- 🔥 TODO: ei jaygay porobortite actual workspace content (notes, files, links,
             model training log etc.) category onujayi build kora hobe -->
        <div class="text-center py-5 text-muted">
            <h1 class="display-4">🚧</h1>
            <p class="fw-bold mt-2">This workspace page is under construction.</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
